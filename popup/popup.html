<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Auto Connect 24/7</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
          </svg>
        </div>
        <div>
          <h1>Auto Connect 24/7</h1>
          <p class="subtitle">Ağım Sayfası Kesintisiz Otomasyon</p>
        </div>
      </div>
      <div id="statusBadge" class="status-badge status-stopped">Durduruldu</div>
    </header>

    <!-- Prominent Counter Card -->
    <div class="stat-card">
      <div class="stat-label">Toplam Gönderilen Bağlantı Daveti</div>
      <div class="stat-value"><span id="totalCount">0</span> <span class="stat-unit">kişi</span></div>
      <div class="stat-sub" id="modeDescription">⚡ 7/24 Kesintisiz Mod (Haftalık limit uyarısında 24sa bekler)</div>
    </div>

    <!-- Status Message & Countdown Box -->
    <div id="statusMessageBox" class="status-message-box">
      <span class="pulse-dot"></span>
      <span id="statusMessage">Hazır. Başlatmak için butona basın.</span>
    </div>

    <!-- Main Action Button -->
    <button id="toggleBtn" class="btn btn-primary">
      <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M8 5v14l11-7z"/>
      </svg>
      <span id="toggleBtnText">⚡ Otomasyonu Başlat</span>
    </button>

    <!-- Shortcut to MyNetwork Page -->
    <button id="openNetworkBtn" class="btn btn-network">
      🔗 LinkedIn Ağım Sayfasına Git (/mynetwork/grow)
    </button>

    <!-- Activity Log -->
    <div class="logs-section">
      <div class="logs-header">
        <span>Canlı İşlem Günlüğü</span>
        <button id="clearLogsBtn" class="clear-btn">Temizle</button>
      </div>
      <div id="logsContainer" class="logs-container">
        <div class="log-empty">Henüz bir işlem kaydedilmedi.</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
